{% set name = "wagtail-autocomplete" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/wagtail_autocomplete-{{ version }}.tar.gz
  sha256: 78733553759b531c4ce9866ecc5231afb5c314cb1dff0bca1a76070a8daaf0ef

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - wagtail >=4.1

test:
  imports:
    - wagtailautocomplete
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/wagtail/wagtail-autocomplete
  summary: An Autocomplete edit handler for Pages, Snippets, and more.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
